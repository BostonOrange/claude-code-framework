# Factory Auto-Merge — Merge PR after approval + checks pass
# Triggered when a factory PR is approved and all checks pass

name: Factory Auto-Merge

on:
  pull_request_review:
    types: [submitted]

# Serialize auto-merge attempts per-PR so multiple rapid approvals don't race.
# We don't cancel in-flight merges — let the first one complete; subsequent
# triggers will no-op if the PR is already merged.
concurrency:
  group: factory-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    if: |
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      contains(github.event.pull_request.labels.*.name, 'factory')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Wait for checks
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;

            // Wait up to 5 minutes for checks to complete. An empty check list
            // must NOT count as "all green": at review time CI may not have
            // registered its check runs yet, and breaking early would merge a
            // PR whose checks never ran.
            let sawChecks = false;
            let allPassed = false;
            for (let i = 0; i < 30; i++) {
              const { data: checks } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pr.head.sha
              });

              if (checks.check_runs.length > 0) {
                sawChecks = true;
                const pending = checks.check_runs.filter(c => c.status !== 'completed');
                if (pending.length === 0) {
                  // Treat 'neutral' as acceptable — common for paths-filtered jobs
                  const passingConclusions = ['success', 'skipped', 'neutral'];
                  const failed = checks.check_runs.filter(c => !passingConclusions.includes(c.conclusion));
                  if (failed.length > 0) {
                    core.setFailed(`Checks failed: ${failed.map(c => c.name).join(', ')}`);
                    return;
                  }
                  allPassed = true;
                  break;
                }
              }

              await new Promise(r => setTimeout(r, 10000)); // wait 10s
            }

            if (sawChecks && !allPassed) {
              core.setFailed('Timed out waiting for checks to complete.');
              return;
            }
            if (!sawChecks) {
              // Repo may genuinely have no CI; rely on branch protection via
              // `gh pr merge --auto` in the next step.
              core.warning('No check runs registered after 5 minutes — deferring to branch protection.');
            }

      - name: Auto-merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --merge \
            --auto
